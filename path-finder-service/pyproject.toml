[project]
name = "path-finder-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "motor>=3.6",
    "aiobotocore>=2.17",
    "redis>=5.2",
    "pydantic>=2.10",
    "path-finder-core",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
