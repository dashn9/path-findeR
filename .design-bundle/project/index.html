<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>path-findeR</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
<link rel="stylesheet" href="colors_and_type.css">
<style id="pf-bg-override">
  /* Paper tone — pale warm cream leaning toward the warm-brown primary */
  :root {
    --bg-page:    oklch(98% 0.030 55);
    --bg-surface: oklch(99% 0.020 55);
    --bg-sunken:  oklch(94% 0.038 55);
    --rule:       oklch(89% 0.022 55);
    --rule-strong:oklch(80% 0.028 55);
    --accent-soft:oklch(94% 0.022 55);
  }
</style>
<style>
  /* ─── Reset ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-1);
    background: var(--bg-page);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: var(--highlight); color: var(--ink-1); }

  /* ─── Shell ─────────────────────────────────────── */
  .pf-shell { display: flex; flex-direction: column; min-height: 100%; }
  .pf-main { display: flex; flex: 1; min-height: 0; }
  .pf-content { flex: 1; min-width: 0; padding: 32px 48px 96px; max-width: 1280px; }

  /* ─── Topbar ────────────────────────────────────── */
  .pf-topbar {
    height: 52px; display: grid; grid-template-columns: 240px 1fr auto;
    align-items: center; padding: 0 24px 0 24px;
    border-bottom: 1px solid var(--rule); background: var(--bg-page);
    position: sticky; top: 0; z-index: 10;
  }
  .pf-brand {
    display: inline-flex; align-items: baseline; gap: 0;
    background: transparent; border: 0; padding: 0; cursor: pointer;
    font-family: var(--font-mono); font-weight: 700; font-size: 16px;
  }
  .pf-brand-slash {
    background: var(--highlight); color: var(--ink-1);
    padding: 0 4px; margin-right: 2px;
  }
  .pf-brand-name  { color: var(--ink-1); }

  .pf-topbar-mid { display: flex; justify-content: flex-start; }
  .pf-jobchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border: 1px solid var(--rule); background: var(--bg-elevated);
    border-radius: 2px; font-size: 12px; color: var(--ink-2);
    transition: border-color var(--t-fast) var(--ease-out);
  }
  .pf-jobchip:hover { border-color: var(--rule-strong); }
  .pf-jobchip-id { color: var(--ink-1); font-weight: 500; }

  .pf-topbar-right { display: flex; align-items: center; gap: 14px; }
  .pf-health {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-2);
  }
  .pf-iconbtn {
    width: 28px; height: 28px; display: grid; place-items: center;
    background: transparent; border: 0; color: var(--ink-2); border-radius: 2px;
    transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
  }
  .pf-iconbtn:hover { background: var(--bg-sunken); color: var(--ink-1); }

  /* ─── Sidebar ───────────────────────────────────── */
  .pf-sidebar {
    width: 240px; flex: none; padding: 24px 16px;
    border-right: 1px solid var(--rule); background: var(--bg-page);
    display: flex; flex-direction: column; gap: 24px;
    position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto;
  }
  .pf-sidebar-sec { display: grid; gap: 4px; }
  .pf-sidebar-h {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-3); padding: 0 8px 8px;
  }
  .pf-navitem {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; background: transparent; border: 0; text-align: left;
    font-size: 13px; color: var(--ink-2); border-radius: 2px;
    transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
  }
  .pf-navitem:hover { background: var(--bg-sunken); color: var(--ink-1); }
  .pf-navitem-on { background: var(--bg-elevated); color: var(--ink-1); border: 1px solid var(--rule); padding: 6px 9px; }
  .pf-sidebar-endpoint {
    display: flex; gap: 8px; padding: 8px 10px; background: var(--bg-elevated);
    border: 1px solid var(--rule); font-size: 11px; color: var(--ink-2);
    overflow: hidden;
  }
  .pf-sidebar-method { color: var(--accent); font-weight: 700; }
  .pf-sidebar-foot {
    margin-top: auto; font-size: 10px; color: var(--ink-3);
    padding: 8px 8px 0; border-top: 1px solid var(--rule);
  }

  /* ─── Generic atoms ─────────────────────────────── */
  .pf-mono { font-family: var(--font-mono); }
  .pf-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .pf-h1 { font-size: 32px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin: 4px 0 0; color: var(--ink-1); }
  .pf-h1-sub { font-size: 18px; color: var(--ink-3); font-weight: 400; }
  .pf-body { font-size: 13px; color: var(--ink-2); }
  .pf-caption { font-size: 12px; color: var(--ink-2); }
  .pf-fg-1 { color: var(--ink-1); }
  .pf-fg-2 { color: var(--ink-2); }
  .pf-fg-3 { color: var(--ink-3); }
  .pf-fg-warn { color: var(--warning); }
  .pf-fg-err { color: var(--danger); }
  .pf-fg-ok  { color: var(--success); }
  .pf-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-row { display: flex; align-items: center; }
  .pf-row-end { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .pf-r { text-align: right; }
  .pf-meta-sep { color: var(--ink-3); padding: 0 4px; }

  /* ─── Screen container ──────────────────────────── */
  .pf-screen { display: grid; gap: 24px; }
  .pf-screen-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .pf-screen-h-meta { font-size: 12px; color: var(--ink-3); }

  /* ─── Card ──────────────────────────────────────── */
  .pf-card {
    background: transparent; border: 1px solid var(--rule);
    border-radius: 0; display: grid; gap: 14px; padding: 18px;
  }
  .pf-card-pad { padding: 20px 22px; }
  .pf-card-h { display: flex; justify-content: space-between; align-items: center; }
  .pf-card-f { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--rule); padding-top: 14px; }
  .pf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1100px) { .pf-grid-2 { grid-template-columns: 1fr; } }

  /* ─── Form atoms ────────────────────────────────── */
  .pf-form { display: grid; gap: 14px; }
  .pf-form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 720px) { .pf-form-row { grid-template-columns: 1fr; } }
  .pf-form-foot { display: flex; align-items: center; gap: 12px; padding-top: 6px; border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 14px; }
  .pf-field { display: grid; gap: 6px; align-content: start; }
  .pf-field-full { grid-column: 1 / -1; }
  .pf-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); letter-spacing: .04em; }
  .pf-input {
    width: 100%; background: var(--bg-elevated); color: var(--ink-1);
    border: 1px solid var(--rule-strong); border-radius: 0;
    padding: 8px 10px; font-size: 13px; outline: none;
    transition: border-color var(--t-fast) var(--ease-out);
  }
  .pf-input::placeholder { color: var(--ink-3); }
  .pf-input:hover { border-color: color-mix(in srgb, var(--rule-strong) 80%, var(--ink-2)); }
  .pf-input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea.pf-input { resize: vertical; line-height: 1.55; }
  .pf-input.pf-mono { font-family: var(--font-mono); }
  .pf-hint { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .pf-input-attach { display: flex; gap: 6px; align-items: stretch; }
  .pf-input-attach .pf-input { flex: 1; }
  .pf-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-1); cursor: pointer; }
  .pf-check input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); }

  /* ─── Button ────────────────────────────────────── */
  .pf-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; font-size: 13px; font-weight: 500; line-height: 1;
    border: 1px solid transparent; border-radius: 0;
    transition: background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
  }
  .pf-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pf-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .pf-btn-sm { padding: 5px 10px; font-size: 12px; }
  .pf-btn-md { /* default */ }
  .pf-btn-primary  { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pf-btn-primary:hover:not(:disabled)  { background: var(--accent-hover); border-color: var(--accent-hover); }
  .pf-btn-primary:active:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
  .pf-btn-secondary  { background: var(--bg-elevated); color: var(--ink-1); border-color: var(--rule-strong); }
  .pf-btn-secondary:hover:not(:disabled)  { background: var(--bg-sunken); }
  .pf-btn-ghost      { background: transparent; color: var(--ink-2); }
  .pf-btn-ghost:hover:not(:disabled) { background: var(--bg-sunken); color: var(--ink-1); }
  .pf-btn-danger     { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* ─── Pipeline status pill ──────────────────────── */
  .pf-pill {
    display: inline-flex; align-items: stretch; gap: 0;
    border: 1px solid var(--rule); background: var(--bg-elevated);
    font-family: var(--font-mono); font-size: 11px; line-height: 1;
    border-radius: 0;
  }
  .pf-pill-name {
    padding: 4px 10px; color: var(--ink-2); letter-spacing: .04em;
    align-self: center;
  }
  .pf-pill-stages {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-left: 1px solid var(--rule); background: var(--bg-page);
  }
  .pf-pill-stage {
    width: 18px; border-right: 1px solid var(--rule);
    display: grid; place-items: center; position: relative;
  }
  .pf-pill-stage:last-child { border-right: 0; }
  .pf-pill-stage::before {
    content: ''; width: 5px; height: 5px; background: var(--rule);
  }
  .pf-pill-stage-on::before { background: var(--ink-1); }
  .pf-pill-stage-cur::before { background: var(--warning); animation: pfblink 1.2s ease-in-out infinite; }
  .pf-pill-stage-fail::before { background: var(--danger); width: 7px; height: 7px; }
  @keyframes pfblink { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  .pf-pill-compact .pf-pill-stage { width: 14px; }
  .pf-pill-compact .pf-pill-name  { padding: 3px 8px; font-size: 10.5px; }

  .pf-pill-t-running { border-color: color-mix(in srgb, var(--warning) 35%, var(--rule)); }
  .pf-pill-t-running .pf-pill-name { background: var(--warning-soft); color: var(--warning); }
  .pf-pill-t-done    { border-color: color-mix(in srgb, var(--success) 35%, var(--rule)); }
  .pf-pill-t-done    .pf-pill-name { background: var(--success-soft); color: var(--success); }
  .pf-pill-t-failed  { border-color: color-mix(in srgb, var(--danger) 35%, var(--rule)); }
  .pf-pill-t-failed  .pf-pill-name { background: var(--danger-soft); color: var(--danger); }

  .pf-pulse { animation: pfblink 1.2s ease-in-out infinite; }
  .pf-pill-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; display: inline-block; }

  .pf-tag {
    display: inline-flex; align-items: center;
    padding: 1px 7px; border-radius: 2px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em;
    border: 1px solid var(--rule); background: var(--bg-page); color: var(--ink-2);
  }
  .pf-tag-type    { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 20%, transparent); }
  .pf-tag-neutral { background: var(--bg-page); color: var(--ink-2); border-color: var(--rule); }
  .pf-tag-accent  { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 20%, transparent); }
  .pf-tag-warning { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
  .pf-tag-danger  { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

  /* ─── Selector chip ─────────────────────────────── */
  .pf-sel-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    padding: 6px 8px 6px 12px;
    transition: border-color var(--t-fast) var(--ease-out);
  }
  .pf-sel-row:hover { border-color: var(--rule-strong); }
  .pf-sel {
    flex: 1; font-family: var(--font-mono); font-size: 13px;
    color: var(--accent); white-space: nowrap; overflow-x: auto; min-width: 0;
  }
  .pf-sel::-webkit-scrollbar { height: 6px; }
  .pf-sel::-webkit-scrollbar-thumb { background: var(--rule-strong); }
  .pf-sel-copy {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    padding: 3px 8px; font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-2); flex: none;
    transition: background var(--t-fast) var(--ease-out);
  }
  .pf-sel-copy:hover { background: var(--bg-sunken); color: var(--ink-1); }

  /* ─── Tabs / Segmented ──────────────────────────── */
  .pf-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); }
  .pf-tab {
    padding: 10px 16px; background: transparent; border: 0;
    font-size: 13px; color: var(--ink-2); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
  }
  .pf-tab:hover { color: var(--ink-1); }
  .pf-tab-on { color: var(--ink-1); border-bottom-color: var(--accent); font-weight: 500; }
  .pf-tab-badge {
    background: var(--bg-sunken); color: var(--ink-2);
    font-family: var(--font-mono); font-size: 10px;
    padding: 1px 6px; border-radius: 9999px;
  }
  .pf-tab-on .pf-tab-badge { background: var(--accent-soft); color: var(--accent); }
  .pf-tab-body { padding-top: 8px; }

  .pf-seg { display: inline-flex; border: 1px solid var(--rule-strong); }
  .pf-seg button {
    background: var(--bg-elevated); border: 0; border-right: 1px solid var(--rule-strong);
    font-size: 12px; padding: 6px 12px; color: var(--ink-2); cursor: pointer;
  }
  .pf-seg button:last-child { border-right: 0; }
  .pf-seg .pf-seg-on { background: var(--ink-1); color: #fff; }

  /* ─── Meta strip ────────────────────────────────── */
  .pf-meta-strip {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 6px 0; padding: 10px 14px;
    background: var(--bg-surface); border: 1px solid var(--rule);
    font-size: 12px; color: var(--ink-2);
  }

  /* ─── Manifest tree ─────────────────────────────── */
  .pf-tree { display: grid; gap: 16px; }
  .pf-tree-meta {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 16px; border-bottom: 1px solid var(--rule);
  }
  .pf-tree-pattern { font-size: 15px; margin-top: 4px; }
  .pf-tree-meta-r { font-size: 11px; color: var(--ink-3); }

  .pf-labels { display: grid; gap: 16px; }
  .pf-label-grp {
    background: var(--bg-surface); border: 1px solid var(--rule);
    padding: 16px 18px; display: grid; gap: 12px;
  }
  .pf-label-grp-unresolved { border-left: 3px solid var(--warning); padding-left: 16px; }
  .pf-label-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .pf-label-name-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .pf-label-name { margin: 0; font-size: 17px; font-weight: 500; color: var(--ink-1); }
  .pf-label-tags { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .pf-label-h-r { font-size: 11px; color: var(--ink-3); flex: none; }
  .pf-label-selectors { display: grid; gap: 6px; }
  .pf-label-warn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--warning);
    padding: 8px 10px; background: var(--warning-soft);
    border: 1px solid color-mix(in srgb, var(--warning) 25%, transparent);
  }

  /* ─── Tester ────────────────────────────────────── */
  .pf-tester { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1100px) { .pf-tester { grid-template-columns: 1fr; } }
  .pf-tester-l { display: grid; gap: 12px; }
  .pf-tester-r { display: grid; gap: 10px; align-content: start; }
  .pf-tester-prompt { padding: 14px; background: var(--bg-surface); border: 1px dashed var(--rule-strong); color: var(--ink-3); font-size: 12px; }
  .pf-tester-row {
    background: var(--bg-elevated); border: 1px solid var(--rule);
    padding: 12px 14px; display: grid; gap: 8px;
  }
  .pf-tester-row-miss { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 20%, transparent); }
  .pf-tester-row-h { display: flex; justify-content: space-between; align-items: baseline; }
  .pf-tester-label { font-weight: 500; }
  .pf-tester-sel { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
  .pf-tester-vals { display: grid; gap: 4px; }
  .pf-tester-val {
    font-size: 12px; padding: 4px 8px;
    background: var(--highlight-soft); border-left: 2px solid var(--highlight);
    color: var(--ink-1); word-break: break-word;
  }

  /* ─── History table ─────────────────────────────── */
  .pf-table { display: grid; background: var(--bg-elevated); border: 1px solid var(--rule); }
  .pf-thead, .pf-trow {
    display: grid;
    grid-template-columns: 130px 90px 1.4fr 1.6fr 80px 110px 100px 20px;
    align-items: center; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .pf-thead { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); background: var(--bg-surface); }
  .pf-trow {
    background: var(--bg-elevated); border: 0; border-bottom: 1px solid var(--rule);
    text-align: left; font: inherit; cursor: pointer;
    transition: background var(--t-fast) var(--ease-out);
  }
  .pf-trow:last-child { border-bottom: 0; }
  .pf-trow:hover { background: var(--bg-sunken); }
  .pf-trow div { font-size: 12px; }

  /* ─── Settings deflist ──────────────────────────── */
  .pf-deflist { margin: 0; display: grid; }
  .pf-defrow {
    display: grid; grid-template-columns: 220px 1fr; gap: 16px;
    padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13px;
  }
  .pf-defrow:last-child { border-bottom: 0; }
  .pf-defrow dt { color: var(--ink-2); }
  .pf-defrow dd { margin: 0; }

  /* ─── Queue ─────────────────────────────────────── */
  .pf-queue { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .pf-queue-item {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 12px; align-items: center;
    padding: 8px 12px; background: var(--bg-elevated); border: 1px solid var(--rule);
  }
  .pf-queue-idx { font-size: 11px; color: var(--ink-3); }
  .pf-queue-body { min-width: 0; }
  .pf-queue-empty {
    padding: 24px 16px; text-align: center; border: 1px dashed var(--rule-strong);
    background: var(--bg-surface);
  }

  /* ─── Empty state ───────────────────────────────── */
  .pf-empty {
    background: var(--bg-surface); border: 1px dashed var(--rule-strong);
    padding: 48px 32px; text-align: center; display: grid; gap: 10px; justify-items: center;
  }
  .pf-empty h3 { margin: 0; font-size: 18px; font-weight: 500; }
  .pf-empty p  { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }

  /* ─── JSON block ────────────────────────────────── */
  .pf-json-wrap { background: var(--bg-elevated); border: 1px solid var(--rule); }
  .pf-json-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--bg-sunken);
  }
  .pf-json-filename { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
  .pf-json-copy {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    padding: 3px 8px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); cursor: pointer;
  }
  .pf-json-pre {
    margin: 0; padding: 16px 18px; font-family: var(--font-mono);
    font-size: 12px; line-height: 1.6; overflow: auto;
  }
  .pf-json-key  { color: #6B4B8A; }
  .pf-json-str  { color: #2F7A4A; }
  .pf-json-num  { color: #C97A1A; }
  .pf-json-bool { color: var(--accent); }
  .pf-json-null { color: var(--ink-3); }

  /* ─── Toast ─────────────────────────────────────── */
  .pf-toasts {
    position: fixed; bottom: 24px; right: 24px;
    display: grid; gap: 8px; z-index: 100; width: min(360px, calc(100vw - 48px));
  }
  .pf-toast {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    padding: 12px 14px;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    border-left: 3px solid var(--accent); border-radius: 2px;
    box-shadow: var(--shadow-toast);
    animation: pftoast-in 160ms var(--ease-out);
  }
  @keyframes pftoast-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .pf-toast-success { border-left-color: var(--success); }
  .pf-toast-error   { border-left-color: var(--danger); }
  .pf-toast-info    { border-left-color: var(--accent); }
  .pf-toast-title { font-weight: 500; font-size: 13px; }
  .pf-toast-text  { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
  .pf-toast-x { background: transparent; border: 0; color: var(--ink-3); padding: 4px; }
  .pf-toast-x:hover { color: var(--ink-1); }

  /* ─── Modal ─────────────────────────────────────── */
  .pf-modal-scrim {
    position: fixed; inset: 0; background: rgba(22,20,14,0.35);
    display: grid; place-items: center; z-index: 200;
    animation: pffade 140ms var(--ease-out);
  }
  @keyframes pffade { from { opacity: 0 } to { opacity: 1 } }
  .pf-modal {
    width: min(560px, calc(100vw - 48px));
    max-height: calc(100vh - 96px); overflow: auto;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    border-radius: 4px; box-shadow: var(--shadow-toast);
  }
  .pf-modal-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
  .pf-modal-title { font-size: 15px; font-weight: 500; }
  .pf-modal-x { background: transparent; border: 0; color: var(--ink-3); padding: 4px; }
  .pf-modal-body { padding: 18px; display: grid; gap: 14px; }
  .pf-modal-f { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid var(--rule); background: var(--bg-surface); }
  .pf-modal-section { display: grid; gap: 6px; }

  .pf-checklist { display: grid; gap: 4px; max-height: 220px; overflow-y: auto;
    border: 1px solid var(--rule); padding: 8px; background: var(--bg-surface); }
  .pf-checklist-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    font-size: 13px;
  }
  .pf-checklist-row input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); }
  .pf-link { background: transparent; border: 0; color: var(--accent); font-size: 12px;
    text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; }

  /* ─── Help / pipeline ───────────────────────────── */
  .pf-help { padding-top: 12px; }
  .pf-pipeline {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin-top: 8px; padding: 14px 18px;
    background: var(--bg-surface); border: 1px solid var(--rule);
    font-size: 12px; color: var(--ink-2);
  }
  .pf-pipeline span { color: var(--ink-1); }

  /* ─── Run Inspector ─────────────────────────────── */
  .pf-insp { display: grid; gap: 16px; }

  .pf-insp-labels {
    display: flex; flex-wrap: wrap; gap: 0;
    align-items: center; padding: 6px 10px;
    background: var(--bg-surface); border: 1px solid var(--rule);
  }
  .pf-insp-labtab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; background: transparent; border: 0;
    font-size: 12px; color: var(--ink-2); border-radius: 0;
    border-right: 1px solid var(--rule);
    transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
  }
  .pf-insp-labtab:first-of-type { border-left: 1px solid var(--rule); margin-left: 6px; }
  .pf-insp-labtab:hover { background: var(--bg-sunken); color: var(--ink-1); }
  .pf-insp-labtab-on {
    background: var(--ink-1); color: #fff;
    border-color: var(--ink-1);
  }
  .pf-insp-labtab-on:hover { background: var(--accent-press); color: #fff; }
  .pf-insp-labtab-warn .pf-mono { color: inherit; }

  .pf-insp-head {
    display: grid; grid-template-columns: 1fr auto; gap: 24px;
    padding: 18px 22px; background: var(--bg-elevated); border: 1px solid var(--rule);
    align-items: center;
  }
  .pf-insp-head-warn { border-left: 3px solid var(--warning); padding-left: 19px; }
  .pf-insp-name { margin: 0; font-size: 22px; font-weight: 500; color: var(--ink-1); }
  .pf-insp-head-r { display: grid; gap: 4px; justify-items: end; min-width: 0; }
  .pf-insp-chosen {
    font-family: var(--font-mono); font-size: 13px; color: var(--ink-1);
    background: var(--highlight); padding: 3px 10px; border-radius: 0;
    line-height: 1.5; max-width: 520px; overflow-x: auto; white-space: nowrap;
  }
  .pf-insp-chosen-none { background: var(--danger-soft); color: var(--danger); }

  /* The card primitive used inside the inspector */
  .pf-insp-card {
    background: var(--bg-surface); border: 1px solid var(--rule);
    display: grid; gap: 12px; padding: 16px 18px; min-width: 0;
  }
  .pf-insp-card-tight { padding: 14px 16px; gap: 10px; }
  .pf-insp-card-h {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; border-bottom: 1px solid var(--rule);
  }

  .pf-insp-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.1fr) minmax(0, 0.95fr);
    gap: 16px; align-items: start;
  }
  @media (max-width: 1280px) {
    .pf-insp-grid { grid-template-columns: 1fr 1fr; }
    .pf-insp-rail { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  }
  @media (max-width: 900px) {
    .pf-insp-grid { grid-template-columns: 1fr; }
    .pf-insp-rail { grid-column: auto; grid-template-columns: 1fr; }
  }
  .pf-insp-rail { display: grid; gap: 16px; }

  /* Candidates */
  .pf-cand-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .pf-cand {
    display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: center;
    width: 100%; text-align: left; background: var(--bg-elevated);
    border: 1px solid var(--rule); padding: 10px 12px; cursor: pointer;
    transition: border-color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
  }
  .pf-cand:hover { border-color: var(--rule-strong); }
  .pf-cand-active { border-color: var(--ink-1); }
  .pf-cand-chosen { border-left: 3px solid var(--ink-1); padding-left: 9px; }
  .pf-cand-chosen.pf-cand-active { background: var(--accent-soft); }

  .pf-cand-rank {
    font-size: 11px; color: var(--ink-3); width: 18px; text-align: center;
  }
  .pf-cand-chosen .pf-cand-rank { color: var(--ink-1); font-size: 13px; }

  .pf-cand-score-col { display: grid; gap: 4px; width: 88px; }
  .pf-cand-score { font-size: 13px; color: var(--ink-1); font-weight: 500; line-height: 1; }
  .pf-cand-bar { height: 4px; background: var(--bg-sunken); position: relative; }
  .pf-cand-bar-fill { height: 100%; transition: width var(--t-normal) var(--ease-out); }

  .pf-cand-body { min-width: 0; display: grid; gap: 4px; }
  .pf-cand-sel {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--accent);
    white-space: nowrap; overflow-x: auto; min-width: 0; display: block;
  }
  .pf-cand-sel::-webkit-scrollbar { height: 4px; }
  .pf-cand-sel::-webkit-scrollbar-thumb { background: var(--rule-strong); }
  .pf-cand-note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .pf-cand-active .pf-cand-note { color: var(--ink-2); }

  /* DOM context */
  .pf-insp-dom-card { padding-bottom: 12px; }
  .pf-iconbtn-sm {
    width: 22px; height: 22px; display: grid; place-items: center;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    color: var(--ink-2); border-radius: 0;
  }
  .pf-iconbtn-sm:hover { background: var(--bg-sunken); color: var(--ink-1); }

  .pf-dom {
    margin: 0; padding: 12px 14px; background: var(--bg-elevated);
    border: 1px solid var(--rule);
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
    overflow-x: auto; color: var(--ink-1);
  }
  .pf-dom-line { display: grid; grid-template-columns: 32px 1fr auto; gap: 6px; align-items: baseline; padding: 1px 0; }
  .pf-dom-ln { color: var(--ink-3); user-select: none; text-align: right; padding-right: 6px; border-right: 1px solid var(--rule); }
  .pf-dom-code { white-space: pre; }
  .pf-dom-line-match {
    background: var(--highlight); margin: 0 -14px; padding: 1px 14px;
    box-shadow: inset 3px 0 0 var(--ink-1);
  }
  .pf-dom-line-match .pf-dom-ln { color: var(--ink-1); border-right-color: rgba(22,20,14,0.2); }
  .pf-dom-bullet { font-size: 10px; color: var(--ink-1); padding-left: 12px; letter-spacing: .04em; }

  .pf-dom-tag     { color: var(--accent); }
  .pf-dom-attr    { color: var(--ink-2); }
  .pf-dom-str     { color: var(--success); }
  .pf-dom-comment { color: var(--ink-3); font-style: italic; }
  .pf-dom-line-match .pf-dom-tag,
  .pf-dom-line-match .pf-dom-attr,
  .pf-dom-line-match .pf-dom-str { color: var(--ink-1); }

  .pf-insp-dom-foot {
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
    padding-top: 10px; border-top: 1px solid var(--rule);
  }
  .pf-dom-vals { display: flex; gap: 6px; flex-wrap: wrap; }
  .pf-dom-val {
    font-family: var(--font-mono); font-size: 11.5px;
    padding: 2px 8px; background: var(--bg-elevated); border: 1px solid var(--rule);
    color: var(--ink-1);
  }
  .pf-dom-val-empty { color: var(--ink-3); background: var(--bg-sunken); }

  /* Validation grid */
  .pf-valid-wrap { display: grid; gap: 4px; }
  .pf-valid-pagecols {
    display: grid;
    grid-template-columns: 56px repeat(var(--n, 6), minmax(0, 1fr));
    gap: 4px; align-items: center;
    font-size: 10px; color: var(--ink-3); letter-spacing: .04em;
  }
  .pf-valid-pcol { text-align: center; }
  .pf-valid-row {
    display: grid;
    grid-template-columns: 56px repeat(var(--n, 6), minmax(0, 1fr)) 38px;
    gap: 4px; align-items: center;
    padding: 4px 6px; background: var(--bg-elevated); border: 1px solid var(--rule);
    transition: background var(--t-fast) var(--ease-out);
  }
  .pf-valid-row-active { background: var(--bg-sunken); border-color: var(--ink-1); }
  .pf-valid-label { font-size: 10px; color: var(--ink-2); letter-spacing: .04em; }
  .pf-valid-cell {
    height: 18px; border-radius: 0; border: 1px solid var(--rule);
  }
  .pf-valid-cell-ok   { background: var(--success); border-color: color-mix(in srgb, var(--success) 60%, transparent); }
  .pf-valid-cell-miss { background: var(--bg-page); border-color: var(--rule-strong); position: relative; }
  .pf-valid-cell-miss::after {
    content: ''; position: absolute; inset: 4px;
    background: repeating-linear-gradient(45deg, transparent 0 3px, var(--ink-3) 3px 4px);
    opacity: .35;
  }
  .pf-valid-tally { text-align: right; font-size: 10.5px; color: var(--ink-2); }
  .pf-valid-row-active .pf-valid-tally { color: var(--ink-1); font-weight: 700; }

  .pf-valid-legend {
    display: flex; gap: 14px; font-size: 10.5px; color: var(--ink-3);
    padding-top: 4px;
  }
  .pf-valid-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .pf-valid-key { width: 10px; height: 10px; display: inline-block; border: 1px solid var(--rule-strong); }
  .pf-valid-key-ok { background: var(--success); border-color: var(--success); }
  .pf-valid-key-miss { background: var(--bg-page); }
  .pf-valid-key-active { background: transparent; border-color: var(--ink-1); border-width: 2px; }

  /* LLM rationale */
  .pf-trace {
    margin: 0; padding: 10px 12px 10px 14px;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    border-left: 3px solid var(--ink-1);
    font-family: var(--font-mono); font-size: 12.5px;
    line-height: 1.65; color: var(--ink-1);
  }

  /* Activity log */
  .pf-log-card { padding-top: 14px; }
  .pf-log {
    background: var(--bg-elevated); border: 1px solid var(--rule);
    overflow: auto; max-height: 320px;
    padding: 6px 0;
  }
  .pf-log-row {
    display: grid; grid-template-columns: 110px 170px 1fr; gap: 14px;
    padding: 4px 14px; font-size: 11.5px; line-height: 1.5;
    border-bottom: 1px dashed transparent;
  }
  .pf-log-row:hover { background: var(--bg-sunken); }
  .pf-log-time   { color: var(--ink-3); }
  .pf-log-kind   { color: var(--ink-1); }
  .pf-log-kind-ok     { color: var(--success); }
  .pf-log-kind-warn   { color: var(--warning); }
  .pf-log-kind-accent { color: var(--accent); font-weight: 500; }
  .pf-log-payload { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="mockData.js"></script>
  <script type="text/babel" src="Components.jsx"></script>
  <script type="text/babel" src="Layout.jsx"></script>
  <script type="text/babel" src="FeedScreen.jsx"></script>
  <script type="text/babel" src="RunInspector.jsx"></script>
  <script type="text/babel" src="ManifestScreen.jsx"></script>
  <script type="text/babel" src="HistoryScreen.jsx"></script>
  <script type="text/babel" src="SettingsScreen.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
